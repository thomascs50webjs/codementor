{% extends "app/base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password" %}{% endblock %}

{% block body %}
<section class="d-flex justify-content-center align-items-center bg-white" style="min-height: 100vh;">
    <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 480px; width: 100%;">
        <h3 class="text-center mb-4">{% trans "Change Password" %}</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="password1" class="form-label">{% trans "New Password" %}</label>
                <input type="password" id="password1" name="password1" class="form-control" placeholder="Enter new password" required>
            </div>
            <div class="mb-4">
                <label for="password2" class="form-label">{% trans "Confirm Password" %}</label>
                <input type="password" id="password2" name="password2" class="form-control" placeholder="Confirm new password" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn w-50" style="background-color: black; color: white; border: none;">
                    {% trans "Change Password" %}
                </button>
                <a href="{% url 'account_login' %}" class="btn w-50" style="background-color: white; color: black; border: 1px solid black;">
                    {% trans "Decline" %}
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
