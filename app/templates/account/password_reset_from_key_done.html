{% extends "app/base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block body %}
<section class="d-flex justify-content-center align-items-center bg-white" style="min-height: 100vh;">
    <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 420px; width: 100%;">
        
        <!-- Title -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-2" style="font-size: 1.8rem;">
                {% trans "Your password has been changed" %}
            </h2>
            <p class="text-secondary" style="font-size: 0.95rem;">
                {% trans "You can now sign in with your new password." %}
            </p>
        </div>

        <!-- Sign In Button -->
        <a href="{% url 'account_login' %}" 
           class="btn w-100 rounded-4 py-2 border border-dark"
           style="background-color: black; color: white; font-weight: 600; letter-spacing: 0.3px;">
            {% trans "Sign In" %}
        </a>
    </div>
</section>
{% endblock %}
